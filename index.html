<!-- index.html (démo ultra-minimale) -->
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Mini CRM — Monolithe & Spaghetti</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem; }
      form { display: flex; gap: .5rem; margin-bottom: 1rem; flex-wrap: wrap; }
      input, button, select { padding: .4rem .6rem; }
      .row { display: flex; gap: 2rem; align-items: start; }
      .panel { flex: 1; border: 1px solid #ddd; padding: 1rem; border-radius: .5rem; }
      ul { padding-left: 1.2rem; }
      .muted { color: #666; font-size: .9rem; }
    </style>
  </head>
  <body>
    <h1>Mini CRM (Monolithe)</h1>

    <div class="row">
      <div class="panel">
        <h2>Contacts</h2>
        <form id="contactForm">
          <input id="c_name" placeholder="Nom" />
          <input id="c_email" placeholder="Email" />
          <button id="btnAddContact">Ajouter contact</button>
          <span class="muted" id="contactsStatus"></span>
        </form>
        <ul id="contactsList"></ul>
      </div>

      <div class="panel">
        <h2>Tâches</h2>
        <form id="taskForm">
          <input id="t_title" placeholder="Titre de tâche" />
          <select id="t_assignee"></select>
          <button id="btnAddTask">Ajouter tâche</button>
          <span class="muted" id="tasksStatus"></span>
        </form>
        <ul id="tasksList"></ul>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
